<script>

class DCLogic{constructor(p){this.props=p||{};this.state={}}setState(o){Object.assign(this.state,o);render()}}
const TPL=document.getElementById('tpl');let comp;
const get=(sc,p)=>p.trim().split('.').reduce((o,k)=>o==null?o:o[k],sc);
const sub=(str,sc)=>{const m=str.match(/^\{\{([^}]+)\}\}$/);if(m){const v=get(sc,m[1]);return v}return str.replace(/\{\{([^}]+)\}\}/g,(_,p)=>{const v=get(sc,p);return v==null?'':v})};
function build(node,sc,out){
  for(const n of node.childNodes){
    if(n.nodeType===3){out.appendChild(document.createTextNode(String(sub(n.textContent,sc)??'')));continue}
    if(n.nodeType!==1)continue;
    const tag=n.tagName.toLowerCase();
    if(tag==='sc-if'){if(sub(n.getAttribute('value'),sc))build(n,sc,out);continue}
    if(tag==='sc-for'){const list=sub(n.getAttribute('list'),sc)||[];const as=n.getAttribute('as');list.forEach(it=>build(n,Object.assign(Object.create(sc),{[as]:it}),out));continue}
    const el=document.createElementNS(n.namespaceURI,n.localName);
    for(const a of n.attributes){
      if(/^on[A-Z]/.test(a.name)||/^on/.test(a.name)&&a.value.includes('{{')){const f=sub(a.value,sc);if(typeof f==='function')el.addEventListener('click',f);continue}
      const v=sub(a.value,sc);if(v===false||v==null)continue;el.setAttribute(a.name,v===true?'true':v)}
    build(n,sc,el);out.appendChild(el)}
}
function render(){const root=document.getElementById('app');const f=document.createDocumentFragment();build(TPL.content,comp.renderVals(),f);root.replaceChildren(f)}


class Component extends DCLogic {
  constructor(p) { super(p); this.state = { s: 0, tw: false, t: 0, q: -1 }; }
  renderVals() {
    const { s, tw, t } = this.state, go = i => () => this.setState({ s: i, q: -1 });
    const fmt = n => n.toLocaleString('ru-RU') + ' ₽';
    const I = [
      'M4 11.5 12 4l8 7.5V20h-5.5v-5h-5v5H4z',
      'M2.5 9 12 4.5 21.5 9 12 13.5zM6.5 11v5c3 2 8 2 11 0v-5',
      'M4 5.5A1.5 1.5 0 0 1 5.5 4H19v14H5.5A1.5 1.5 0 0 0 4 19.5zM4 19.5A1.5 1.5 0 0 0 5.5 21H19',
      'M12 3.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 0 0 0-17zM9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.4M12 17h.01'
    ];
    const tick = on => ({ on, cls: on ? '' : 'chip', bg: on ? '#111111' : '#F2F2F3', fg: on ? '#FFFFFF' : '#55555A' });
    const where = tw ? 'на Тайване' : 'в Китае';
    const FAQ = [
      [['Когда начинать подготовку?', 'Оптимально — за 9–12 месяцев до начала учёбы. Основной набор в китайские университеты проходит на сентябрь, часть программ принимает студентов и в марте. Заявки на стипендию правительства Китая (CSC) обычно принимают с января по март–апрель, а сами университеты закрывают приём к маю–июню. Чем раньше мы начнём, тем больше программ и стипендий останется доступно.'],
       ['Нужно ли знать китайский язык?', 'Для языковых курсов — нет, их можно начать с нуля. Для бакалавриата на китайском языке университеты, как правило, требуют HSK 4, для магистратуры — HSK 4–5 в зависимости от специальности. Есть и программы на английском языке: для них нужен подтверждённый уровень английского. Если сертификата пока нет, подготовим вас к экзамену на наших уроках.'],
       ['Можно ли учиться бесплатно?', 'Да, со стипендией. Полная стипендия CSC покрывает обучение, проживание в общежитии и медицинскую страховку, а также включает ежемесячную выплату. Помимо неё существуют стипендии провинций, городов и самих университетов — полные и частичные. Мы подберём те, на которые у вас есть реальные шансы, и подготовим заявку.'],
       ['Какие документы понадобятся?', 'Обычно это загранпаспорт, аттестат или диплом с оценками и переводом, мотивационное письмо, рекомендательные письма, языковой сертификат и медицинская форма для иностранцев. Точный список зависит от университета и программы — мы составим его под ваш случай и проверим каждый документ перед подачей.'],
       ['Чем отличаются пакеты?', '«Подача» подойдёт тем, кто готов сам заняться визой и переездом: мы консультируем, подбираем программы и подаём документы. «Под ключ» — полное дистанционное сопровождение до зачисления: стипендия, переписка с университетом, виза и медосмотр. «Личное сопровождение» включает всё это и наш приезд: проходим процедуры на месте вместе с вами и помогаем устроиться в первые дни учёбы.']],
      [['Когда начинать подготовку?', 'Также за 9–12 месяцев до начала учёбы. На Тайване два набора — на осенний семестр (сентябрь) и на весенний (февраль). Сроки по стипендиям наступают раньше университетских: заявки на Taiwan Scholarship и Huayu Enrichment Scholarship обычно принимают в феврале–марте, поэтому план лучше составить заранее.'],
       ['Нужно ли знать китайский язык?', 'Для языковых центров при университетах — нет. Для бакалавриата и магистратуры на китайском языке нужен сертификат TOCFL, обычно уровня B. Многие университеты предлагают и программы на английском языке. На Тайване пишут традиционными иероглифами — поможем освоить их заранее.'],
